---
# Homepage configuration - 课程资料导航（测试数据）
# See https://fontawesome.com/search for icons options

title: "课程资料导航"
subtitle: "学习资源一站式入口"
logo: "logo.png"
# icon: "fas fa-graduation-cap" # Optional icon

header: true
footer: '<p>课程资料导航 · 基于 <a href="https://github.com/bastienwirtz/homer">Homer</a> 构建 · 点击卡片在新窗口打开资料</p>'

# Optional theme customization
theme: default

# Optional theme customization (color overrides)
colors:
  light:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#ffffff"
    text-title: "#303030"
    text-subtitle: "#424242"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#3273dc"
    link-hover: "#363636"
  dark:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#131313"
    card-background: "#2b2b2b"
    text: "#eaeaea"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#3273dc"
    link-hover: "#ffdd57"

# Optional message
message:
  style: "is-info"
  title: "欢迎使用课程资料导航"
  icon: "fa fa-graduation-cap"
  content: "按分类浏览资料，顶部搜索框支持按标题/描述实时检索。点击任意卡片将在新窗口打开对应资料链接。"

# Optional navbar (empty = 仅保留搜索与主题切换)
links: []

# Services
# 第一层数组 = 分类（分组），每个分组下的 items 为该分类的资料条目
services:
  - name: "前端基础"
    icon: "fas fa-code"
    items:
      - name: "HTML 教程"
        icon: "fa-brands fa-html5"
        subtitle: "MDN Web Docs - HTML 基础参考"
        tag: "前端"
        url: "https://developer.mozilla.org/zh-CN/docs/Web/HTML"
        target: "_blank"
      - name: "CSS 教程"
        icon: "fa-brands fa-css3-alt"
        subtitle: "MDN Web Docs - 层叠样式表"
        tag: "前端"
        url: "https://developer.mozilla.org/zh-CN/docs/Web/CSS"
        target: "_blank"
      - name: "JavaScript 教程"
        icon: "fa-brands fa-js"
        subtitle: "MDN Web Docs - JS 语言核心"
        tag: "前端"
        url: "https://developer.mozilla.org/zh-CN/docs/Web/JavaScript"
        target: "_blank"
      - name: "Vue 官方文档"
        icon: "fa-brands fa-vuejs"
        subtitle: "渐进式 JavaScript 框架"
        tag: "前端"
        url: "https://cn.vuejs.org/"
        target: "_blank"
      - name: "React 官方文档"
        icon: "fas fa-atom"
        subtitle: "用于构建用户界面的 JS 库"
        tag: "前端"
        url: "https://zh-hans.react.dev/"
        target: "_blank"

  - name: "后端 Java"
    icon: "fas fa-server"
    items:
      - name: "Java 教程"
        icon: "fa-brands fa-java"
        subtitle: "Oracle 官方 Java 语言教程"
        tag: "后端"
        url: "https://docs.oracle.com/javase/tutorial/"
        target: "_blank"
      - name: "Spring Boot 文档"
        icon: "fas fa-leaf"
        subtitle: "用于快速构建生产级 Spring 应用"
        tag: "后端"
        url: "https://spring.io/projects/spring-boot"
        target: "_blank"
      - name: "MyBatis 文档"
        icon: "fas fa-database"
        subtitle: "优秀的持久层框架"
        tag: "后端"
        url: "https://mybatis.org/mybatis-3/zh/index.html"
        target: "_blank"
      - name: "Maven 指南"
        icon: "fas fa-cube"
        subtitle: "项目构建与依赖管理"
        tag: "后端"
        url: "https://maven.apache.org/guides/"
        target: "_blank"
      - name: "廖雪峰 Java 教程"
        icon: "fas fa-book-open"
        subtitle: "通俗易懂的 Java 入门"
        tag: "后端"
        url: "https://www.liaoxuefeng.com/wiki/1252599548343744"
        target: "_blank"

  - name: "数据库"
    icon: "fas fa-database"
    items:
      - name: "MySQL 文档"
        icon: "fa-solid fa-database"
        subtitle: "最流行的开源关系型数据库"
        tag: "数据库"
        url: "https://dev.mysql.com/doc/"
        target: "_blank"
      - name: "PostgreSQL 文档"
        icon: "fa-solid fa-database"
        subtitle: "强大的开源对象关系数据库"
        tag: "数据库"
        url: "https://www.postgresql.org/docs/"
        target: "_blank"
      - name: "Redis 文档"
        icon: "fa-solid fa-bolt"
        subtitle: "内存数据结构存储"
        tag: "数据库"
        url: "https://redis.io/docs/latest/"
        target: "_blank"
      - name: "Apache Doris 文档"
        icon: "fa-solid fa-warehouse"
        subtitle: "实时分析型数据仓库"
        tag: "数据库"
        url: "https://doris.apache.org/zh-CN/docs/dev/"
        target: "_blank"
      - name: "MongoDB 手册"
        icon: "fa-solid fa-leaf"
        subtitle: "文档型 NoSQL 数据库"
        tag: "数据库"
        url: "https://www.mongodb.com/docs/"
        target: "_blank"

  - name: "工具"
    icon: "fas fa-tools"
    items:
      - name: "Git 手册"
        icon: "fa-brands fa-git-alt"
        subtitle: "分布式版本控制系统"
        tag: "工具"
        url: "https://git-scm.com/doc"
        target: "_blank"
      - name: "GitHub"
        icon: "fa-brands fa-github"
        subtitle: "全球代码托管与协作平台"
        tag: "工具"
        url: "https://github.com/"
        target: "_blank"
      - name: "Postman"
        icon: "fas fa-paper-plane"
        subtitle: "API 开发与测试工具"
        tag: "工具"
        url: "https://www.postman.com/"
        target: "_blank"
      - name: "Stack Overflow"
        icon: "fa-brands fa-stack-overflow"
        subtitle: "程序员问答社区"
        tag: "工具"
        url: "https://stackoverflow.com/"
        target: "_blank"
      - name: "菜鸟教程"
        icon: "fas fa-book"
        subtitle: "全面的编程入门教程站"
        tag: "工具"
        url: "https://www.runoob.com/"
        target: "_blank"
